<!--
  The viewBox must end where the artwork ends. Content spans x 8 → 272.75
  (mark at 8; the "l" stem terminal at 104 + 168.75), so the box is 272.75 + 8
  for an even 8-unit margin either side. A wider box leaves dead space on the
  right, which makes a centred <img> look off-centre.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 281 96" role="img" aria-label="cmail" fill="none">
  <title>cmail</title>
  <desc>The cmail horizontal lockup: an open-envelope app mark with a cyan status dot, beside a constructed monoline wordmark whose "i" carries the same dot as its tittle.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#2B88D8"/>
      <stop offset="55%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#005A9E"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- userSpaceOnUse: the stems are zero-width paths, and an
         objectBoundingBox gradient on a zero-width box is degenerate — those
         glyphs would not render at all. -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="169" y2="56">
      <stop offset="0%" stop-color="#106EBE"/>
      <stop offset="62%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#2B88D8"/>
    </linearGradient>
  </defs>

  <!-- App mark, 72×72 -->
  <g transform="translate(8 12) scale(1.125)">
    <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#tile)"/>
    <path d="M0 15A15 15 0 0 1 15 0h34a15 15 0 0 1 15 15v13H0z" fill="url(#gloss)"/>
    <g stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 25.5v20.2a2.8 2.8 0 0 0 2.8 2.8h32.4a2.8 2.8 0 0 0 2.8-2.8V25.5"/>
      <path d="M13 25.5 30.3 38a2.9 2.9 0 0 0 3.4 0L51 25.5"/>
      <path d="M13 25.5 30.3 13a2.9 2.9 0 0 1 3.4 0L51 25.5"/>
    </g>
    <circle cx="51" cy="13" r="6" fill="#50E6FF"/>
  </g>

  <!-- Wordmark. Letterforms are constructed from arcs and stems of a single
       weight, so the logo needs no font to render identically everywhere.
       Grid — baseline y=56, x-height top y=22, ascender y=8, stroke 6.5. -->
  <g transform="translate(104 16)">
    <g stroke="url(#ink)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M33.65 28.53A17 17 0 1 0 33.65 49.47"/>
      <path d="M47 56V32A10 10 0 0 1 67 32V56M67 32A10 10 0 0 1 87 32V56"/>
      <circle cx="117.5" cy="39" r="17"/>
      <path d="M134.5 22V56"/>
      <path d="M150 22V56"/>
      <path d="M165.5 8V56"/>
    </g>
    <circle cx="150" cy="11" r="3.75" fill="#50E6FF"/>
  </g>
</svg>
