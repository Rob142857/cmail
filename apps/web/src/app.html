<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- Cloudflare Email Address Obfuscation (on by default for new zones)
         rewrites addresses in served HTML, so the page would no longer match
         what the app hydrates. email_off opts the app out and, unlike
         Cache-Control: no-transform, keeps edge compression. -->
    <!--email_off--><div style="display: contents">%sveltekit.body%</div><!--/email_off-->
  </body>
</html>
