packages:
  - apps/*
  - packages/*

# Some Corepack hosts launch workspace child scripts with their bundled pnpm.
# The lockfile and packageManager field still pin installs to pnpm 11.18.0.
pmOnFail: ignore

overrides:
  cookie: ^0.7.2
  esbuild: ^0.28.1
  "nanoid@<3.3.18": 3.3.18
  postcss: ^8.5.18
  "miniflare>sharp": 0.35.4
  undici: ^7.29.0
  ws: ^8.21.0

allowBuilds:
  core-js-pure: true
  esbuild: true
  "sharp@0.35.4": false
  workerd: true

minimumReleaseAgeExclude:
  - globals@17.9.0

onlyBuiltDependencies:
  - core-js-pure
  - esbuild
  - workerd
