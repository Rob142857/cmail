packages:
  - apps/*
  - packages/*

# Some Corepack hosts launch workspace child scripts with their bundled pnpm.
# The lockfile and packageManager field still pin installs to pnpm 11.18.0.
pmOnFail: ignore

overrides:
  cookie: ^0.7.2
  esbuild: ^0.28.1
  postcss: ^8.5.18
  sharp: ^0.35.0
  undici: ^7.29.0
  ws: ^8.21.0

allowBuilds:
  core-js-pure: true
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - globals@17.9.0

onlyBuiltDependencies:
  - core-js-pure
  - esbuild
  - sharp
  - workerd
